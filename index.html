<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Alarm App</title>

<style>
body{
 background:#111;color:#fff;
 font-family:Arial;
 display:flex;justify-content:center;
 align-items:center;height:100vh;margin:0;
 transition:.3s;
}
body.light{background:#f2f2f2;color:#000;}

.box{
 background:#222;padding:20px;
 border-radius:12px;width:350px;
 max-height:95vh;overflow:auto;
}
body.light .box{background:#fff;}

input,select,button{
 width:100%;padding:10px;margin:6px 0;
}

.switch{
 display:flex;justify-content:space-between;
 align-items:center;margin:6px 0;
}

.alarmItem{
 display:flex;
 justify-content:space-between;
 align-items:center;
 background:#333;
 padding:8px;
 margin-top:6px;
 border-radius:6px;
 font-size:14px;
 gap:6px;
}
body.light .alarmItem{background:#eee;}

.deleteBtn{
 background:#d32f2f;
 color:#fff;
 border:none;
 padding:6px 10px;
 border-radius:4px;
}

#stopBtn{
 display:none;
 background:#e53935;
 color:#fff;
 border:none;
 font-size:16px;
}
</style>
</head>

<body>
<div class="box">
<h3>⏰ Alarm App</h3>

<input type="time" id="time">

<select id="tone">
 <option value="wake">🌅 Wake Up</option>
 <option value="whistle">🎶 Whistle</option>
 <option value="classic">⏰ Classic</option>
 <option value="beep">📟 Beep</option>
 <option value="custom">🎧 Custom</option>
</select>

<input type="file" id="customFile" accept="audio/*">

<button onclick="addAlarm()">➕ Add Alarm</button>

<div class="switch">🔊 Sound <input type="checkbox" id="sound" checked></div>
<div class="switch">📳 Vibration <input type="checkbox" id="vibe" checked></div>
<div class="switch">🌙 Light Mode <input type="checkbox" onchange="toggleTheme(this)"></div>

<button id="stopBtn" onclick="stopAlarm()">⏹ Stop Alarm</button>

<h4>🔁 Alarms List</h4>
<div id="alarmList"></div>

<p id="msg"></p>

<audio id="audio" loop preload="auto"></audio>
</div>

<script>
const tones={
 wake:"https://actions.google.com/sounds/v1/alarms/morning_alarm.ogg",
 whistle:"https://actions.google.com/sounds/v1/alarms/whistle_alarm.ogg",
 classic:"https://actions.google.com/sounds/v1/alarms/alarm_clock.ogg",
 beep:"https://actions.google.com/sounds/v1/alarms/beep_short.ogg"
};

let alarms=[];
let ringing=false;
let activeIndex=null;
let customURL=null;

const audio=document.getElementById("audio");
const stopBtn=document.getElementById("stopBtn");

document.body.addEventListener("click",()=>{
 audio.play().then(()=>audio.pause()).catch(()=>{});
},{once:true});

customFile.addEventListener("change",()=>{
 if(customFile.files.length){
  customURL=URL.createObjectURL(customFile.files[0]);
  msg.innerText="Custom ringtone loaded 🎧";
 }
});

function addAlarm(){
 if(!time.value){alert("Time select karo");return;}
 if(tone.value==="custom" && !customURL){
  alert("Custom ringtone upload karo");return;
 }
 alarms.push({
  time:time.value,
  tone:tone.value,
  active:true,
  fired:false
 });
 render();
 msg.innerText="Alarm Added ✅";
}

function render(){
 alarmList.innerHTML="";
 alarms.forEach((a,i)=>{
  alarmList.innerHTML+=`
   <div class="alarmItem">
    <span>${a.time} (${a.tone})</span>
    <input type="checkbox" ${a.active?"checked":""}
      onchange="toggleAlarm(${i},this)">
    <button class="deleteBtn" onclick="deleteAlarm(${i})">❌</button>
   </div>`;
 });
}

function toggleAlarm(i,el){
 alarms[i].active=el.checked;
 alarms[i].fired=false;
}

function deleteAlarm(i){
 alarms.splice(i,1);
 render();
 msg.innerText="Alarm Deleted 🗑️";
}

setInterval(()=>{
 let d=new Date();
 let now=d.getHours().toString().padStart(2,"0")+":"+
         d.getMinutes().toString().padStart(2,"0");

 alarms.forEach((a,i)=>{
  if(a.active && !a.fired && now===a.time && !ringing){
   a.fired=true;
   startAlarm(i);
  }
 });
},1000);

function startAlarm(i){
 ringing=true;
 activeIndex=i;
 stopBtn.style.display="block";
 msg.innerText="⏰ Alarm Baj Raha Hai!";

 audio.pause();
 audio.currentTime=0;
 audio.src = alarms[i].tone==="custom" ? customURL : tones[alarms[i].tone];

 if(sound.checked){
  audio.load();
  audio.play().catch(()=>{});
 }

 if(vibe.checked && navigator.vibrate){
  navigator.vibrate([500,300,500,300]);
 }
}

function stopAlarm(){
 audio.pause();
 audio.currentTime=0;
 ringing=false;
 stopBtn.style.display="none";
 msg.innerText="Alarm Stopped ⏹️";
}

function toggleTheme(el){
 document.body.classList.toggle("light",el.checked);
}
</script>
</body>
</html>
